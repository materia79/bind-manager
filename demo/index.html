<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bind Manager — Demo</title>
  <link rel="icon" href="data:," />
  <style>
    /*
     * Page chrome scales like the library UI: --demo-u is 1px at 1920x1080 and
     * follows the viewport, clamped to [0.6667px, 2px]. It repeats the clamp of
     * the library's --bm-u instead of reading it, because the library injects
     * its stylesheet later and this sheet must not depend on that order.
     * Text that would get too small has a px floor (10px / 11px), so the HUD
     * is an exact scaled copy only where the floors do not apply: from about
     * 1477px wide at 16:9 (13u >= 10px). Below that, text stays legible instead
     * of shrinking further.
     */
    :root {
      --demo-u: clamp(0.6667px, min(100vw / 1920, 100vh / 1080), 2px);
      --demo-fs-s: max(10px, calc(13 * var(--demo-u)));
      --demo-fs-m: max(11px, calc(15 * var(--demo-u)));
      --demo-gap: calc(8 * var(--demo-u));
      --demo-edge: calc(16 * var(--demo-u));
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      background: #0d0d1a;
      color: #c8c8e0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: var(--demo-fs-m);
      min-height: 100vh;
      overflow: hidden;
    }

    /* Simulated game canvas backdrop */
    #game-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 40%, #0f2a4a 0%, #050510 70%);
    }
    #game-canvas:focus { outline: none; }

    /* Grid overlay for depth cue */
    #game-canvas::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(80,120,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80,120,255,0.07) 1px, transparent 1px);
      background-size: calc(60 * var(--demo-u)) calc(60 * var(--demo-u));
    }

    /* ── HUD frame: event log on the left, controls on the right ── */
    #hud {
      position: fixed;
      inset: var(--demo-edge) var(--demo-edge) auto var(--demo-edge);
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: calc(16 * var(--demo-u));
      pointer-events: none;
    }
    #hud > * { pointer-events: auto; }

    .hud-panel {
      background: rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
      border-radius: calc(10 * var(--demo-u));
      backdrop-filter: blur(8px);
    }

    /* ── Event log ── */
    #log {
      width: calc(440 * var(--demo-u));
      min-width: 0;
      max-height: calc(300 * var(--demo-u));
      overflow-y: auto;
      padding: calc(12 * var(--demo-u)) calc(16 * var(--demo-u));
    }

    #log-title,
    .hud-panel-title {
      font-size: var(--demo-fs-s);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5c7cfa;
      margin-bottom: calc(6 * var(--demo-u));
    }

    .log-entry {
      font-size: var(--demo-fs-s);
      color: #a0a0c0;
      padding: calc(3 * var(--demo-u)) 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .log-entry:last-child { border-bottom: none; }
    .log-entry.pressed  { color: #60d080; }
    .log-entry.released { color: #e06060; }
    .log-entry.held     { color: #a060e0; }
    .log-entry.changed  { color: #ffa040; }
    .log-entry.info     { color: #7090c0; }

    /* ── Controls ── */
    #controls {
      display: flex;
      flex-direction: column;
      gap: var(--demo-gap);
      align-items: flex-end;
      max-height: calc(100vh - 2 * var(--demo-edge));
      overflow-y: auto;
    }

    .hud-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--demo-gap);
      align-items: flex-end;
    }

    .hud-btn {
      background: rgba(92, 124, 250, 0.2);
      border: 0;
      box-shadow: inset 0 0 0 1px rgba(92, 124, 250, 0.5);
      border-radius: calc(8 * var(--demo-u));
      color: #c0ccff;
      font-size: var(--demo-fs-m);
      font-family: inherit;
      line-height: 1.2;
      cursor: pointer;
      padding: calc(8 * var(--demo-u)) calc(18 * var(--demo-u));
      transition: background 0.15s, box-shadow 0.15s;
    }
    .hud-btn:hover {
      background: rgba(92, 124, 250, 0.4);
      box-shadow: inset 0 0 0 1px #5c7cfa;
    }
    .hud-btn:focus-visible {
      outline: calc(2 * var(--demo-u)) solid #5c7cfa;
      outline-offset: calc(2 * var(--demo-u));
    }
    .hud-btn:disabled { opacity: 0.4; cursor: default; }

    #hint-toggle-btn {
      background: rgba(40, 140, 80, 0.2);
      box-shadow: inset 0 0 0 1px rgba(40, 200, 100, 0.4);
      color: #80dca0;
    }
    #hint-toggle-btn:hover {
      background: rgba(40, 140, 80, 0.4);
      box-shadow: inset 0 0 0 1px rgba(40,200,100,0.8);
    }

    .hud-tool-btn {
      background: rgba(200, 144, 0, 0.16);
      box-shadow: inset 0 0 0 1px rgba(200, 144, 0, 0.5);
      color: #ffd480;
    }
    .hud-tool-btn:hover {
      background: rgba(200, 144, 0, 0.32);
      box-shadow: inset 0 0 0 1px rgba(255, 196, 64, 0.85);
    }

    .guard-status {
      font-size: var(--demo-fs-s);
      color: #7090c0;
      background: rgba(0, 0, 0, 0.55);
      border-radius: calc(6 * var(--demo-u));
      padding: calc(4 * var(--demo-u)) calc(10 * var(--demo-u));
    }

    /* ── Simulated controller ── */
    #fake-controller {
      width: calc(330 * var(--demo-u));
      padding: calc(10 * var(--demo-u)) calc(12 * var(--demo-u));
      display: grid;
      gap: calc(6 * var(--demo-u));
      box-shadow: inset 0 0 0 1px rgba(255, 196, 64, 0.35);
    }
    #fake-controller .hud-panel-title { color: #ffc440; margin: 0; }
    .fake-badge {
      display: inline-block;
      margin-left: calc(6 * var(--demo-u));
      padding: 0 calc(6 * var(--demo-u));
      border-radius: calc(4 * var(--demo-u));
      background: rgba(255, 196, 64, 0.18);
      color: #ffd480;
      letter-spacing: 0.04em;
    }
    #fake-select {
      width: 100%;
      font: inherit;
      font-size: var(--demo-fs-m);
      color: #e0e0f0;
      background: #16162a;
      border: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
      border-radius: calc(6 * var(--demo-u));
      padding: calc(5 * var(--demo-u)) calc(8 * var(--demo-u));
    }
    #fake-status, .hud-note {
      font-size: var(--demo-fs-s);
      color: #98a6d8;
    }
    .fake-pad {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(max(56px, calc(68 * var(--demo-u))), 1fr));
      gap: calc(4 * var(--demo-u));
    }
    .fake-pad .hud-btn {
      padding: calc(6 * var(--demo-u)) calc(4 * var(--demo-u));
      font-size: var(--demo-fs-s);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      touch-action: none;
      user-select: none;
    }
    .fake-pad .hud-btn.is-down {
      background: rgba(255, 196, 64, 0.45);
      box-shadow: inset 0 0 0 1px #ffc440;
      color: #fff6dc;
    }

    /* ── Centre title ── */
    #center-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 50;
      width: max-content;
      max-width: calc(100vw - 2 * var(--demo-edge));
    }
    #center-text h1 {
      font-size: max(20px, calc(42 * var(--demo-u)));
      font-weight: 700;
      color: rgba(200, 210, 255, 0.9);
      text-shadow: 0 0 calc(40 * var(--demo-u)) rgba(92,124,250,0.6);
      margin-bottom: calc(8 * var(--demo-u));
    }
    #center-text p {
      font-size: var(--demo-fs-m);
      color: rgba(150, 160, 200, 0.7);
    }
    #center-text kbd {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
      border-radius: calc(3 * var(--demo-u));
      padding: calc(1 * var(--demo-u)) calc(6 * var(--demo-u));
      font-size: var(--demo-fs-s);
      font-family: inherit;
    }

    /* Narrow viewports (phones, small windows): controls on top, log below. */
    @media (max-width: 760px) {
      #hud {
        flex-direction: column;
        align-items: stretch;
        inset: 8px 8px auto 8px;
        gap: 8px;
      }
      #controls { order: -1; align-items: stretch; max-height: none; overflow: visible; }
      .hud-buttons { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; gap: 6px; }
      .hud-buttons .hud-btn { padding: 6px 10px; }
      #fake-controller { width: auto; }
      #log { width: auto; max-height: 22vh; }
      #center-text { top: auto; bottom: 30vh; transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <div id="game-canvas" tabindex="0" title="Click to capture the cursor (Esc releases)"></div>

  <div id="hud">
    <div id="log" class="hud-panel" aria-live="polite">
      <div id="log-title">Event Log</div>
    </div>

    <div id="controls">
      <div class="hud-buttons">
        <button class="hud-btn" id="open-btn" type="button">⚙ Key Bindings</button>
        <button class="hud-btn hud-tool-btn" id="open-tester-btn" type="button">🎮 Controller Test</button>
        <button class="hud-btn hud-tool-btn" id="open-remap-btn" type="button">🧭 Input Remap</button>
        <button class="hud-btn" id="hint-toggle-btn" type="button">👁 Toggle Hints</button>
        <button class="hud-btn" id="reset-btn" type="button">↺ Reset All</button>
        <button class="hud-btn" id="fullscreen-btn" type="button">⛶ Fullscreen + Keyboard Lock</button>
        <button class="hud-btn" id="leave-guard-btn" type="button">🚪 Arm Leave Guard</button>
      </div>
      <div id="guard-status" class="guard-status">Guard: idle</div>

      <section id="fake-controller" class="hud-panel" aria-labelledby="fake-title">
        <h2 class="hud-panel-title" id="fake-title">Fake controller <span class="fake-badge">simulated</span></h2>
        <select id="fake-select" aria-label="Simulated controller family"></select>
        <div id="fake-status">No simulated pad</div>
        <div id="fake-pad" class="fake-pad" hidden>
          <button class="hud-btn" type="button" data-fake-input="b0">GP_B0</button>
          <button class="hud-btn" type="button" data-fake-input="b1">GP_B1</button>
          <button class="hud-btn" type="button" data-fake-input="b2">GP_B2</button>
          <button class="hud-btn" type="button" data-fake-input="b3">GP_B3</button>
          <button class="hud-btn" type="button" data-fake-input="b6">GP_B6</button>
          <button class="hud-btn" type="button" data-fake-input="b9">GP_B9</button>
          <button class="hud-btn" type="button" data-fake-input="b12">GP_B12</button>
          <button class="hud-btn" type="button" data-fake-input="b17">GP_B17</button>
          <button class="hud-btn" type="button" data-fake-input="ls-up">GP_A1N</button>
          <button class="hud-btn" type="button" data-fake-input="ls-left">GP_A0N</button>
        </div>
        <p class="hud-note">A pretend gamepad for trying the controller features without one. Hold a button to press it. Real pads are hidden while it is on.</p>
      </section>
    </div>
  </div>

  <div id="center-text">
    <h1>Bind Manager Demo</h1>
    <p>Press <kbd>F5</kbd> or click "Key Bindings" to open the modal.</p>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
