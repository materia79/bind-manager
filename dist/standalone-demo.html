<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bind Manager Demo</title>
    <link rel="icon" href="data:," />
    <style>
      /*
       * Page chrome scales like the library UI: --demo-u is 1px at 1920x1080 and
       * follows the viewport, clamped to [0.6667px, 2px] (the clamp of the
       * library's --bm-u, repeated here because the bundle injects its stylesheet
       * later). Text that would get too small has a px floor (10px / 11px), so
       * the HUD is an exact scaled copy only where the floors do not apply: from
       * about 1477px wide at 16:9 (13u >= 10px). Below that, text stays legible
       * instead of shrinking further.
       */
      :root {
        --demo-u: clamp(0.6667px, min(100vw / 1920, 100vh / 1080), 2px);
        --demo-fs-s: max(10px, calc(13 * var(--demo-u)));
        --demo-fs-m: max(11px, calc(15 * var(--demo-u)));
        --demo-gap: calc(8 * var(--demo-u));
        --demo-edge: calc(16 * var(--demo-u));
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      [hidden] { display: none !important; }

      body {
        background: #0d0d1a;
        color: #c8c8e0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: var(--demo-fs-m);
        min-height: 100vh;
        overflow: hidden;
      }

      #game-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at 50% 40%, #0f2a4a 0%, #050510 70%);
      }

      #game-canvas::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(80, 120, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(80, 120, 255, 0.07) 1px, transparent 1px);
        background-size: calc(60 * var(--demo-u)) calc(60 * var(--demo-u));
      }

      #hud {
        position: fixed;
        inset: var(--demo-edge) calc(96 * var(--demo-u)) auto var(--demo-edge);
        z-index: 100;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: calc(16 * var(--demo-u));
        pointer-events: none;
      }

      #hud > * { pointer-events: auto; }

      .hud-panel {
        background: rgba(0, 0, 0, 0.65);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        border-radius: calc(10 * var(--demo-u));
        backdrop-filter: blur(8px);
      }

      #log {
        width: calc(560 * var(--demo-u));
        min-width: 0;
        max-height: 50vh;
        overflow-y: auto;
        padding: calc(12 * var(--demo-u)) calc(16 * var(--demo-u));
      }

      #log-title,
      .hud-panel-title {
        font-size: var(--demo-fs-s);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5c7cfa;
        margin-bottom: calc(6 * var(--demo-u));
      }

      #controls {
        display: flex;
        flex-direction: column;
        gap: var(--demo-gap);
        align-items: flex-end;
        max-height: calc(100vh - 2 * var(--demo-edge));
        overflow-y: auto;
      }

      .hud-buttons {
        display: flex;
        flex-direction: column;
        gap: var(--demo-gap);
        align-items: flex-end;
      }

      .github-corner {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 140;
      }

      .github-corner svg {
        width: calc(80 * var(--demo-u));
        height: calc(80 * var(--demo-u));
        min-width: 48px;
        min-height: 48px;
      }

      .hud-btn {
        background: rgba(92, 124, 250, 0.2);
        border: 0;
        box-shadow: inset 0 0 0 1px rgba(92, 124, 250, 0.5);
        border-radius: calc(8 * var(--demo-u));
        color: #c0ccff;
        font-size: var(--demo-fs-m);
        font-family: inherit;
        line-height: 1.2;
        cursor: pointer;
        padding: calc(8 * var(--demo-u)) calc(18 * var(--demo-u));
        transition: background 0.15s, box-shadow 0.15s;
      }

      .hud-btn:hover {
        background: rgba(92, 124, 250, 0.4);
        box-shadow: inset 0 0 0 1px #5c7cfa;
      }

      .hud-btn:focus-visible {
        outline: calc(2 * var(--demo-u)) solid #5c7cfa;
        outline-offset: calc(2 * var(--demo-u));
      }

      .hud-btn:disabled { opacity: 0.4; cursor: default; }

      #toggle-hints {
        background: rgba(40, 140, 80, 0.2);
        box-shadow: inset 0 0 0 1px rgba(40, 200, 100, 0.4);
        color: #80dca0;
      }

      #toggle-hints:hover {
        background: rgba(40, 140, 80, 0.4);
        box-shadow: inset 0 0 0 1px rgba(40, 200, 100, 0.8);
      }

      .hud-tool-btn {
        background: rgba(200, 144, 0, 0.16);
        box-shadow: inset 0 0 0 1px rgba(200, 144, 0, 0.5);
        color: #ffd480;
      }

      .hud-tool-btn:hover {
        background: rgba(200, 144, 0, 0.32);
        box-shadow: inset 0 0 0 1px rgba(255, 196, 64, 0.85);
      }

      .hud-label {
        position: fixed;
        left: var(--demo-edge);
        bottom: var(--demo-edge);
        z-index: 100;
        font-size: var(--demo-fs-s);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8ea3f0;
        background: rgba(0, 0, 0, 0.45);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        border-radius: calc(7 * var(--demo-u));
        padding: calc(6 * var(--demo-u)) calc(10 * var(--demo-u));
      }

      .log-entry {
        font-size: var(--demo-fs-s);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: calc(4 * var(--demo-u)) 0;
      }

      .log-entry:last-child { border-bottom: 0; }
      .log-entry.pressed { color: #7de3a8; }
      .log-entry.released { color: #ff9f9f; }
      .log-entry.held { color: #d9b6ff; }
      .log-entry.changed { color: #ffd18a; }
      .log-entry.info { color: #9fb7f2; }

      #fake-controller {
        width: calc(330 * var(--demo-u));
        padding: calc(10 * var(--demo-u)) calc(12 * var(--demo-u));
        display: grid;
        gap: calc(6 * var(--demo-u));
        box-shadow: inset 0 0 0 1px rgba(255, 196, 64, 0.35);
      }

      #fake-controller .hud-panel-title { color: #ffc440; margin: 0; }

      .fake-badge {
        display: inline-block;
        margin-left: calc(6 * var(--demo-u));
        padding: 0 calc(6 * var(--demo-u));
        border-radius: calc(4 * var(--demo-u));
        background: rgba(255, 196, 64, 0.18);
        color: #ffd480;
        letter-spacing: 0.04em;
      }

      #fake-select {
        width: 100%;
        font: inherit;
        font-size: var(--demo-fs-m);
        color: #e0e0f0;
        background: #16162a;
        border: 0;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
        border-radius: calc(6 * var(--demo-u));
        padding: calc(5 * var(--demo-u)) calc(8 * var(--demo-u));
      }

      #fake-status, .hud-note {
        font-size: var(--demo-fs-s);
        color: #98a6d8;
      }

      .fake-pad {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(max(56px, calc(68 * var(--demo-u))), 1fr));
        gap: calc(4 * var(--demo-u));
      }

      .fake-pad .hud-btn {
        padding: calc(6 * var(--demo-u)) calc(4 * var(--demo-u));
        font-size: var(--demo-fs-s);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        touch-action: none;
        user-select: none;
      }

      .fake-pad .hud-btn.is-down {
        background: rgba(255, 196, 64, 0.45);
        box-shadow: inset 0 0 0 1px #ffc440;
        color: #fff6dc;
      }

      /* Narrow viewports (phones, small windows): controls on top, log below. */
      @media (max-width: 760px) {
        #hud {
          flex-direction: column;
          align-items: stretch;
          inset: 8px 56px auto 8px;
          gap: 8px;
        }
        #controls { order: -1; align-items: stretch; max-height: none; overflow: visible; }
        .hud-buttons { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; gap: 6px; }
        .hud-buttons .hud-btn { padding: 6px 10px; }
        #fake-controller { width: auto; }
        #log { width: auto; max-height: 22vh; }
        .hud-label { display: none; }
      }
    </style>
  </head>
  <body>
    <a href="https://github.com/materia79/bind-manager" target="_blank" class="github-corner" aria-label="View source on GitHub"><svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true"><path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"/><path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"/><path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"/></svg></a><style>.github-corner:hover .octo-arm{animation:octocat-wave 560ms ease-in-out}@keyframes octocat-wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-25deg)}40%,80%{transform:rotate(10deg)}}@media (max-width:500px){.github-corner:hover .octo-arm{animation:none}.github-corner .octo-arm{animation:octocat-wave 560ms ease-in-out}}</style>

    <div id="game-canvas" aria-hidden="true"></div>

    <div id="hud">
      <div id="log" class="hud-panel" aria-live="polite">
        <div id="log-title">Event Log</div>
        <div id="log-entries"></div>
      </div>

      <div id="controls">
        <div class="hud-buttons">
          <button id="open-binds" class="hud-btn" type="button">Open Key Bindings</button>
          <button id="open-tester" class="hud-btn hud-tool-btn" type="button">Controller Test</button>
          <button id="open-remap" class="hud-btn hud-tool-btn" type="button">Input Remap</button>
          <button id="toggle-hints" class="hud-btn" type="button">Hide Hints</button>
          <button id="reset-all" class="hud-btn" type="button">Reset All Bindings</button>
          <button id="clear-log" class="hud-btn" type="button">Clear Log</button>
        </div>

        <section id="fake-controller" class="hud-panel" aria-labelledby="fake-title">
          <h2 class="hud-panel-title" id="fake-title">Fake controller <span class="fake-badge">simulated</span></h2>
          <select id="fake-select" aria-label="Simulated controller family"></select>
          <div id="fake-status">No simulated pad</div>
          <div id="fake-pad" class="fake-pad" hidden>
            <button class="hud-btn" type="button" data-fake-input="b0">GP_B0</button>
            <button class="hud-btn" type="button" data-fake-input="b1">GP_B1</button>
            <button class="hud-btn" type="button" data-fake-input="b2">GP_B2</button>
            <button class="hud-btn" type="button" data-fake-input="b3">GP_B3</button>
            <button class="hud-btn" type="button" data-fake-input="b6">GP_B6</button>
            <button class="hud-btn" type="button" data-fake-input="b9">GP_B9</button>
            <button class="hud-btn" type="button" data-fake-input="b12">GP_B12</button>
            <button class="hud-btn" type="button" data-fake-input="b17">GP_B17</button>
            <button class="hud-btn" type="button" data-fake-input="ls-up">GP_A1N</button>
            <button class="hud-btn" type="button" data-fake-input="ls-left">GP_A0N</button>
          </div>
          <p class="hud-note">A pretend gamepad for trying the controller features without one. Hold a button to press it. Real pads are hidden while it is on.</p>
        </section>
      </div>
    </div>

    <div class="hud-label">Bind Manager Demo</div>

    <script src="./bind-manager.min.js"></script>
    <script>
      (function () {
        const logPanelEl = document.getElementById('log');
        const logEl = document.getElementById('log-entries');
        const MAX_LOG_LINES = 80;

        const appendLog = (text, type) => {
          const stamp = new Date().toLocaleTimeString();
          const line = document.createElement('div');
          line.className = `log-entry ${type || 'info'}`;
          line.textContent = `[${stamp}] ${text}`;
          logEl.appendChild(line);

          while (logEl.childElementCount > MAX_LOG_LINES) {
            logEl.removeChild(logEl.firstElementChild);
          }

          logPanelEl.scrollTop = logPanelEl.scrollHeight;
        };

        if (!window.BindManager || !window.BindManager.createBindManager) {
          appendLog('ERROR: bind-manager.min.js is missing or invalid.', 'released');
          return;
        }

        const binds = window.BindManager.createBindManager({
          namespace: 'standalone-demo',
          debug: true,
          debugKey: 'F5',
          builtInTools: {
            inputRemap: true,
            controllerTest: true,
          },
        });

        const moveForward = binds.registerAction({
          id: 'move-forward',
          label: 'Move Forward',
          description: 'Move character forward',
          group: 'Movement',
          slots: 2,
          defaultBindings: ['KeyW', 'ArrowUp'],
          gamepadSlots: 1,
          defaultGamepadBindings: ['GP_A1N'],
        });

        const moveBackward = binds.registerAction({
          id: 'move-backward',
          label: 'Move Backward',
          description: 'Move character backward',
          group: 'Movement',
          slots: 2,
          defaultBindings: ['KeyS', 'ArrowDown'],
          gamepadSlots: 1,
          defaultGamepadBindings: ['GP_A1P'],
        });

        const jump = binds.registerAction({
          id: 'jump',
          label: 'Jump',
          description: 'Jump action',
          group: 'Movement',
          slots: 1,
          defaultBindings: ['Space'],
          gamepadSlots: 1,
          defaultGamepadBindings: ['GP_B0'],
        });

        const attack = binds.registerAction({
          id: 'attack',
          label: 'Attack',
          description: 'Primary attack',
          group: 'Combat',
          slots: 1,
          defaultBindings: ['KeyF'],
          gamepadSlots: 1,
          defaultGamepadBindings: ['GP_B2'],
        });

        const block = binds.registerAction({
          id: 'block',
          label: 'Block',
          description: 'Hold to block',
          group: 'Combat',
          slots: 1,
          defaultBindings: ['KeyG'],
          gamepadSlots: 1,
          defaultGamepadBindings: ['GP_B1'],
        });

        const interact = binds.registerAction({
          id: 'interact',
          label: 'Interact',
          description: 'Interact with world objects',
          group: 'Interface',
          slots: 1,
          defaultBindings: ['KeyE'],
          gamepadSlots: 1,
          defaultGamepadBindings: ['GP_B3'],
        });

        const openMap = binds.registerAction({
          id: 'open-map',
          label: 'Open Map',
          description: 'Toggle world map',
          group: 'Interface',
          slots: 1,
          defaultBindings: ['KeyM'],
          gamepadSlots: 1,
          // An extra button: Touchpad / Share / Capture, depending on the pad
          defaultGamepadBindings: ['GP_B17'],
        });

        const sprint = binds.registerAction({
          id: 'sprint',
          label: 'Sprint',
          description: 'Hold to sprint',
          group: 'Movement',
          slots: 1,
          defaultBindings: ['ShiftLeft'],
          gamepadSlots: 1,
          defaultGamepadBindings: ['GP_B5'],
        });

        moveForward.showHint();
        moveBackward.showHint();
        jump.showHint();
        attack.showHint();
        interact.showHint();

        moveForward.onPressed(() => appendLog('[action] move-forward pressed', 'pressed'));
        moveForward.onReleased(() => appendLog('[action] move-forward released', 'released'));
        moveForward.onHeld(() => appendLog('[action] move-forward held', 'held'));
        moveBackward.onPressed(() => appendLog('[action] move-backward pressed', 'pressed'));
        jump.onPressed(() => appendLog('[action] jump pressed', 'pressed'));
        attack.onPressed(() => appendLog('[action] attack pressed', 'pressed'));
        block.onPressed(() => appendLog('[action] block start', 'pressed'));
        block.onReleased(() => appendLog('[action] block stop', 'released'));
        interact.onPressed(() => appendLog('[action] interact pressed', 'pressed'));
        openMap.onPressed(() => appendLog('[action] open-map toggled', 'pressed'));
        sprint.onPressed(() => appendLog('[action] sprint start', 'pressed'));
        sprint.onReleased(() => appendLog('[action] sprint stop', 'released'));

        binds.subscribe((event) => {
          if (event.type === 'binding-changed') {
            const value = event.newCode == null ? 'unbound' : String(event.newCode);
            appendLog(`[bind] ${event.actionId} slot ${event.slot} => ${value}`, 'changed');
          } else if (event.type === 'reset') {
            appendLog(`[info] ${event.actionId} reset to defaults`, 'info');
          }
        });

        document.getElementById('open-binds').addEventListener('click', () => binds.open());
        // The built-in tools: also reachable from the bindings modal's footer.
        document.getElementById('open-remap').addEventListener('click', () => binds.openInputRemap());
        document.getElementById('open-tester').addEventListener('click', () => binds.openControllerTest());

        let hintsVisible = true;
        const hintsButton = document.getElementById('toggle-hints');
        hintsButton.addEventListener('click', () => {
          hintsVisible = !hintsVisible;
          if (hintsVisible) {
            binds.showAllHints();
            hintsButton.textContent = 'Hide Hints';
          } else {
            binds.hideAllHints();
            hintsButton.textContent = 'Show Hints';
          }
          appendLog(`[info] hints ${hintsVisible ? 'shown' : 'hidden'}`, 'info');
        });

        document.getElementById('reset-all').addEventListener('click', () => {
          binds.resetAll();
          appendLog('[info] reset all bindings', 'info');
        });

        document.getElementById('clear-log').addEventListener('click', () => {
          logEl.textContent = '';
          appendLog('[info] log cleared', 'info');
        });

        createFakeController({
          select: document.getElementById('fake-select'),
          pad: document.getElementById('fake-pad'),
          status: document.getElementById('fake-status'),
          labelFor: (code) => binds.getGamepadLabel(code),
          log: (text) => appendLog(`[info] ${text}`, 'info'),
        });

        appendLog('Demo ready. Press F5 to toggle Bind Manager UI.', 'info');
        appendLog('Try W/ArrowUp, Space, F, G, E, M, ShiftLeft, or connected gamepad defaults.', 'info');
        appendLog('No gamepad? Pick a pad in the Fake controller panel.', 'info');
      })();

      /**
       * Fake controller (simulated gamepad), the same as demo/fake-controller.js in
       * the repository, inlined so this page stays one file next to the bundle.
       * Picking a family installs a fake navigator.getGamepads() with one
       * standard-mapped pad; the on-screen buttons press its inputs while held.
       * Off by default; turning it off restores the browser's getGamepads().
       */
      function createFakeController({ select, pad, status, labelFor, log }) {
        const FAKE_CONTROLLERS = {
          xbox: { label: 'Xbox Wireless', id: 'Xbox Wireless Controller (STANDARD GAMEPAD Vendor: 045e Product: 0b13)', buttons: 18 },
          'xbox-elite': { label: 'Xbox Elite Series 2', id: 'Xbox Elite Wireless Controller Series 2 (STANDARD GAMEPAD Vendor: 045e Product: 0b00)', buttons: 21 },
          xbox360: { label: 'Xbox 360', id: 'Xbox 360 Controller (STANDARD GAMEPAD Vendor: 045e Product: 028e)', buttons: 17 },
          dualshock4: { label: 'DualShock 4', id: 'Wireless Controller (STANDARD GAMEPAD Vendor: 054c Product: 09cc)', buttons: 18 },
          dualsense: { label: 'DualSense', id: 'DualSense Wireless Controller (STANDARD GAMEPAD Vendor: 054c Product: 0ce6)', buttons: 18 },
          'switch-pro': { label: 'Switch Pro', id: 'Pro Controller (STANDARD GAMEPAD Vendor: 057e Product: 2009)', buttons: 18 },
          'steam-deck': { label: 'Steam Deck', id: 'Steam Deck Controller (STANDARD GAMEPAD Vendor: 28de Product: 1205)', buttons: 24 },
          stadia: { label: 'Stadia', id: 'Stadia Controller rev. A (STANDARD GAMEPAD Vendor: 18d1 Product: 9400)', buttons: 19 },
          unknown: { label: 'Unknown USB pad', id: 'USB Gamepad (STANDARD GAMEPAD Vendor: 0079 Product: 0011)', buttons: 17 },
        };
        const INPUTS = {
          b0: { code: 'GP_B0', button: 0 },
          b1: { code: 'GP_B1', button: 1 },
          b2: { code: 'GP_B2', button: 2 },
          b3: { code: 'GP_B3', button: 3 },
          b6: { code: 'GP_B6', button: 6 },
          b9: { code: 'GP_B9', button: 9 },
          b12: { code: 'GP_B12', button: 12 },
          b17: { code: 'GP_B17', button: 17 },
          'ls-up': { code: 'GP_A1N', axis: 1, value: -1 },
          'ls-left': { code: 'GP_A0N', axis: 0, value: -1 },
        };
        const nativeDescriptor = Object.getOwnPropertyDescriptor(Navigator.prototype, 'getGamepads');
        const state = { key: null, id: '', buttons: [], axes: [], timestamp: 0 };

        select.innerHTML = '<option value="">Off (no simulated pad)</option>'
          + Object.entries(FAKE_CONTROLLERS).map(([key, def]) => `<option value="${key}">${def.label}</option>`).join('');
        select.value = '';

        const snapshot = () => ({
          id: state.id,
          index: 0,
          connected: true,
          mapping: 'standard',
          timestamp: state.timestamp,
          buttons: state.buttons.map((b) => ({ ...b })),
          axes: state.axes.slice(),
          vibrationActuator: null,
          hapticActuators: [],
        });

        // GamepadEvent rejects non-native pads, so a plain Event carries `gamepad`.
        const fire = (type, gamepad) => {
          const event = new Event(type);
          Object.defineProperty(event, 'gamepad', { value: gamepad });
          window.dispatchEvent(event);
        };

        const install = () => Object.defineProperty(Navigator.prototype, 'getGamepads', {
          configurable: true,
          writable: true,
          value: function getGamepads() { return [state.key ? snapshot() : null, null, null, null]; },
        });

        const uninstall = () => {
          if (nativeDescriptor) Object.defineProperty(Navigator.prototype, 'getGamepads', nativeDescriptor);
          else delete Navigator.prototype.getGamepads;
        };

        const disconnect = () => {
          if (!state.key) return;
          const last = snapshot();
          state.key = null;
          fire('gamepaddisconnected', { ...last, connected: false });
        };

        const connect = (key) => {
          const def = FAKE_CONTROLLERS[key];
          if (!def) return;
          install();
          state.key = key;
          state.id = def.id;
          state.buttons = Array.from({ length: def.buttons }, () => ({ pressed: false, touched: false, value: 0 }));
          state.axes = [0, 0, 0, 0];
          state.timestamp = performance.now();
          fire('gamepadconnected', snapshot());
        };

        const setInput = (name, down) => {
          const input = INPUTS[name];
          if (!state.key || !input) return;
          if (input.button != null) {
            const b = state.buttons[input.button];
            if (!b) return;
            Object.assign(b, { pressed: down, touched: down, value: down ? 1 : 0 });
          } else {
            state.axes[input.axis] = down ? input.value : 0;
          }
          state.timestamp = performance.now();
        };

        const releaseAll = () => {
          for (const btn of pad.querySelectorAll('.is-down')) btn.classList.remove('is-down');
          for (const b of state.buttons) Object.assign(b, { pressed: false, touched: false, value: 0 });
          state.axes.fill(0);
          state.timestamp = performance.now();
        };

        const render = () => {
          const def = state.key ? FAKE_CONTROLLERS[state.key] : null;
          pad.hidden = !def;
          status.textContent = def ? `Simulated: ${def.label}` : 'No simulated pad';
          status.title = def ? def.id : '';
          for (const btn of pad.querySelectorAll('[data-fake-input]')) {
            const input = INPUTS[btn.dataset.fakeInput];
            btn.disabled = !def || (input.button != null && input.button >= def.buttons);
            btn.textContent = def ? labelFor(input.code) : input.code;
            btn.title = input.code;
          }
        };

        select.addEventListener('change', () => {
          // An on-screen button held while switching must not stay highlighted or pressed.
          releaseAll();
          disconnect();
          if (select.value) {
            connect(select.value);
            log(`Simulated controller on: ${FAKE_CONTROLLERS[select.value].label}`);
          } else {
            uninstall();
            log('Simulated controller off');
          }
          render();
        });

        // Hold to press: pointer down presses, pointer up / cancel releases.
        pad.addEventListener('pointerdown', (ev) => {
          const btn = ev.target.closest('[data-fake-input]');
          if (!btn || btn.disabled) return;
          ev.preventDefault();
          try { btn.setPointerCapture(ev.pointerId); } catch { /* synthetic events have no active pointer */ }
          btn.classList.add('is-down');
          setInput(btn.dataset.fakeInput, true);
        });
        const release = (ev) => {
          const btn = ev.target.closest && ev.target.closest('[data-fake-input]');
          if (!btn || !btn.classList.contains('is-down')) return;
          btn.classList.remove('is-down');
          setInput(btn.dataset.fakeInput, false);
        };
        pad.addEventListener('pointerup', release);
        pad.addEventListener('pointercancel', release);
        pad.addEventListener('lostpointercapture', release);
        window.addEventListener('blur', releaseAll);

        render();
      }
    </script>
  </body>
</html>
